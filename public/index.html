<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agar.io - Учим Английский</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background-color: #0f172a; font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; color: #fff; }

    #ui-header {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px);
      padding: 12px 30px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center; z-index: 10; pointer-events: none;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    #target-label { font-size: 12px; text-transform: uppercase; color: #94a3b8; letter-spacing: 2px; }
    #target-word { font-size: 26px; font-weight: 800; color: #38bdf8; min-height: 32px; }

    #speed-mode-badge {
      display: none; background: #fabe2c; color: #0f172a; font-size: 11px;
      font-weight: 800; padding: 2px 10px; border-radius: 10px; text-transform: uppercase;
      letter-spacing: 1px; margin-top: 2px;
    }

    #score-board {
      position: absolute; top: 20px; left: 20px;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px);
      padding: 12px 24px; border-radius: 14px; font-size: 18px; font-weight: bold;
      z-index: 10; border: 1px solid rgba(255, 255, 255, 0.15); display: flex; gap: 15px; align-items: center;
    }

    #leaderboard {
      position: absolute; top: 20px; right: 20px;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px);
      padding: 14px 20px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 10; min-width: 180px;
    }
    #leaderboard h3 { font-size: 14px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; text-align: center; }
    #leaderboard-list { list-style: none; font-size: 14px; }
    #leaderboard-list li { display: flex; justify-content: space-between; gap: 15px; margin-bottom: 4px; }
    #leaderboard-list li.me { color: #38bdf8; font-weight: bold; }

    #abilities-bar {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px);
      padding: 10px 15px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex; gap: 12px; z-index: 10;
    }
    .ability-btn {
      background: #1e293b; border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px;
      font-weight: 600; cursor: pointer; transition: all 0.2s ease;
      display: flex; align-items: center; gap: 8px;
    }
    .ability-btn:hover { background: #334155; border-color: #38bdf8; }
    .ability-btn:active { transform: scale(0.96); }

    .modal {
      display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px); z-index: 100; justify-content: center; align-items: center;
    }
    .modal-content {
      background: #1e293b; padding: 30px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.2);
      max-width: 550px; width: 90%; text-align: center; max-height: 80vh; overflow-y: auto;
    }
    .modal-title { font-size: 24px; color: #38bdf8; margin-bottom: 15px; }

    .btn {
      padding: 14px; background: #0284c7; color: #ffffff; border: none;
      border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px;
      transition: all 0.2s;
    }
    .btn:hover { background: #0369a1; }
    .btn-full { width: 100%; }
  </style>
</head>
<body>

  <!-- Экран входа -->
  <div id="login-overlay" style="position: fixed; inset: 0; background: #0f172a; z-index: 1000; display: flex; justify-content: center; align-items: center;">
    <div style="background: #1e293b; padding: 30px; border-radius: 16px; width: 340px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.2);">
      <h2 style="margin-bottom: 20px; color: #38bdf8;">Вход в игру</h2>
      <input type="text" id="username-input" placeholder="Введите ваш ник" style="width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 16px; outline: none;">
      <button id="start-game-btn" class="btn btn-full">Играть</button>
    </div>
  </div>

  <!-- Шапка задания -->
  <div id="ui-header">
    <div id="target-label">Найди перевод:</div>
    <div id="target-word">Загрузка...</div>
    <div id="speed-mode-badge">⚡ Кто быстрее</div>
  </div>

  <!-- Информационная панель -->
  <div id="score-board">
    <div id="round-timer-container" style="display: none; color: #fabe2c; align-items: center; gap: 4px;">
      ⏱ <span id="round-timer">25</span>s
    </div>
    <!-- Индикатор работы локатора/подсказки -->
    <div id="hint2-timer-container" style="display: none; color: #a855f7; align-items: center; gap: 4px;">
      🧭 <span id="hint2-timer">20</span>s
    </div>
    <span>Счёт: <span id="score">0</span></span>
  </div>

  <!-- Лидерборд -->
  <div id="leaderboard">
    <h3>🏆 Топ игроков</h3>
    <ul id="leaderboard-list">
      <li><span>1. ---</span><span>0</span></li>
    </ul>
  </div>

  <!-- Панель способностей магазина -->
  <div id="abilities-bar">
    <button class="ability-btn" id="btn-speed">⚡ Ускорение (40 очков)</button>
    <button class="ability-btn" id="btn-locator">🧭 Локатор (20 очков)</button>
    <button class="ability-btn" id="btn-player-radar">🎯 Найти игрока (35 очков)</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <!-- Модальное окно завершения раунда -->
  <div id="game-over-modal" class="modal">
    <div class="modal-content">
      <h2 class="modal-title" id="winner-title">🎉 Победитель!</h2>
      <div id="game-over-leaderboard" style="margin-bottom: 20px; text-align: left;"></div>
      <p style="font-size: 14px; color: #94a3b8;">Новый раунд начнется автоматически через несколько секунд...</p>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="ui.js"></script>
  <script src="game.js"></script>
</body>
</html>
